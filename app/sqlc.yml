version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/api/db/schema.sql"
    queries: "internal/api/db/query/"
    database:
      uri: "postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
    gen:
      go:
        package: "database"
        out: "internal/api/database"
        sql_package: "pgx/v5"
