name: CI & Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Tests
        run: go test -v ./...

      - name: Build Test API & TUI
        run: |
          go build -v ./cmd/api
          go build -v ./cmd/tui
