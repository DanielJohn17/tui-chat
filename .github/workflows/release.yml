name: Release & Build Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build TUI Releases & API Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Build TUI Client Binaries (Public) & Server API (Private)
        run: |
          mkdir -p dist
          mkdir -p build

          # -------------------------------------------------------------
          # 1. Build Server API Binary (For Private Deployment Only)
          # -------------------------------------------------------------
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/api ./cmd/api

          # -------------------------------------------------------------
          # 2. Build TUI Client Binaries (For Public GitHub Release)
          # -------------------------------------------------------------
          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/tui-linux-amd64 ./cmd/tui
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/tui-linux-arm64 ./cmd/tui
          CGO_ENABLED=0 GOOS=linux GOARCH=386   go build -ldflags="-s -w" -o dist/tui-linux-386   ./cmd/tui

          # Windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/tui-windows-amd64.exe ./cmd/tui
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o dist/tui-windows-arm64.exe ./cmd/tui
          CGO_ENABLED=0 GOOS=windows GOARCH=386   go build -ldflags="-s -w" -o dist/tui-windows-386.exe   ./cmd/tui

          # macOS (Darwin)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/tui-darwin-amd64 ./cmd/tui
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/tui-darwin-arm64 ./cmd/tui

          # -------------------------------------------------------------
          # 3. Generate SHA256 Checksums for TUI Binaries
          # -------------------------------------------------------------
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Upload Private API Binary Artifact (For cPanel Deployment)
        uses: actions/upload-artifact@v4
        with:
          name: api-binary
          path: build/api
          retention-days: 1

      - name: Create Public GitHub Release (TUI Clients Only)
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

  deploy-to-cpanel:
    name: Auto Deploy to cPanel
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Download API Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-binary
          path: .

      - name: Copy API Binary to cPanel Server
        if: ${{ env.CPANEL_PASSWORD != '' || env.CPANEL_SSH_KEY != '' }}
        uses: appleboy/scp-action@v0.1.7
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        with:
          host: ${{ secrets.CPANEL_HOST || '198.38.92.6' }}
          username: ${{ secrets.CPANEL_USER || 'natchevy' }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          source: "api"
          target: "/home/natchevy/apps/api"

      - name: Restart API on cPanel
        if: ${{ env.CPANEL_PASSWORD != '' || env.CPANEL_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        with:
          host: ${{ secrets.CPANEL_HOST || '198.38.92.6' }}
          username: ${{ secrets.CPANEL_USER || 'natchevy' }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          script: |
            cd /home/natchevy/apps/api || exit 1
            chmod +x api
            pkill -x api || true

            if [ ! -f ./start.sh ]; then
              cat << 'EOF' > ./start.sh
            #!/bin/bash
            APP_DIR="/home/natchevy/apps/api"
            cd "$APP_DIR" || exit 1
            if ! pgrep -x api > /dev/null; then
                nohup ./api >> api.log 2>&1 &
            fi
            EOF
              chmod +x ./start.sh
            fi

            ./start.sh
            echo "Deployment to cPanel complete!"
