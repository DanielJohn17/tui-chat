name: Release & Build Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build TUI Releases & API Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Validate Release Secrets
        run: |
          if [ -z "${{ secrets.APP_SHARED_SECRET }}" ]; then
            echo "::error::APP_SHARED_SECRET repository secret is required to build release binaries!"
            exit 1
          fi

      - name: Build TUI Client Binaries (Public) & Server API (Private)
        env:
          RELEASE_API_URL: ${{ vars.API_URL || secrets.API_URL || 'https://api-tui.natcher.me' }}
        run: |
          mkdir -p dist
          mkdir -p build

          # -------------------------------------------------------------
          # 1. Build Server API Binary (For Private Deployment Only)
          # -------------------------------------------------------------
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/api ./cmd/api

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TUI_LDFLAGS="-s -w -X main.DefaultAPIURL=${RELEASE_API_URL} -X main.DefaultGoEnv=production -X main.DefaultAppSecret=${{ secrets.APP_SHARED_SECRET }} -X main.Version=${TAG_NAME} -X main.Commit=${GITHUB_SHA} -X main.BuildDate=${BUILD_DATE}"



          # -------------------------------------------------------------
          # 2. Build LineTalk Client Binaries (For Public GitHub Release)
          # -------------------------------------------------------------
          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${TUI_LDFLAGS}" -o "dist/linetalk-${TAG_NAME}-linux-amd64" ./cmd/tui
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${TUI_LDFLAGS}" -o "dist/linetalk-${TAG_NAME}-linux-arm64" ./cmd/tui
          CGO_ENABLED=0 GOOS=linux GOARCH=386   go build -ldflags="${TUI_LDFLAGS}" -o "dist/linetalk-${TAG_NAME}-linux-386"   ./cmd/tui

          # Windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${TUI_LDFLAGS}" -o "dist/linetalk-${TAG_NAME}-windows-amd64.exe" ./cmd/tui
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="${TUI_LDFLAGS}" -o "dist/linetalk-${TAG_NAME}-windows-arm64.exe" ./cmd/tui
          CGO_ENABLED=0 GOOS=windows GOARCH=386   go build -ldflags="${TUI_LDFLAGS}" -o "dist/linetalk-${TAG_NAME}-windows-386.exe"   ./cmd/tui

          # macOS (Darwin)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${TUI_LDFLAGS}" -o "dist/linetalk-${TAG_NAME}-darwin-amd64" ./cmd/tui
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${TUI_LDFLAGS}" -o "dist/linetalk-${TAG_NAME}-darwin-arm64" ./cmd/tui



          # -------------------------------------------------------------
          # 3. Create Unversioned Binary Aliases for Direct Permalinks
          # -------------------------------------------------------------
          cp "dist/linetalk-${TAG_NAME}-linux-amd64" "dist/linetalk-linux-amd64"
          cp "dist/linetalk-${TAG_NAME}-linux-arm64" "dist/linetalk-linux-arm64"
          cp "dist/linetalk-${TAG_NAME}-linux-386"   "dist/linetalk-linux-386"
          cp "dist/linetalk-${TAG_NAME}-windows-amd64.exe" "dist/linetalk-windows-amd64.exe"
          cp "dist/linetalk-${TAG_NAME}-windows-arm64.exe" "dist/linetalk-windows-arm64.exe"
          cp "dist/linetalk-${TAG_NAME}-windows-386.exe"   "dist/linetalk-windows-386.exe"
          cp "dist/linetalk-${TAG_NAME}-darwin-amd64" "dist/linetalk-darwin-amd64"
          cp "dist/linetalk-${TAG_NAME}-darwin-arm64" "dist/linetalk-darwin-arm64"

          # -------------------------------------------------------------
          # 4. Generate SHA256 Checksums for TUI Binaries
          # -------------------------------------------------------------
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Upload Private API Binary Artifact (For cPanel Deployment)
        uses: actions/upload-artifact@v4
        with:
          name: api-binary
          path: build/api
          retention-days: 1

      - name: Determine Release Notes Path
        id: release_notes
        run: |
          if [ -f ".github/releases/${{ github.ref_name }}.md" ]; then
            echo "path=.github/releases/${{ github.ref_name }}.md" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Public GitHub Release (TUI Clients Only)
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LineTalk ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.path }}
          generate_release_notes: ${{ steps.release_notes.outputs.path == '' }}
          files: |
            dist/*
          draft: false
          prerelease: false

  deploy-to-cpanel:
    name: Auto Deploy to cPanel
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Download API Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: api-binary
          path: .

      - name: Copy API Binary to cPanel Server
        if: ${{ env.CPANEL_PASSWORD != '' || env.CPANEL_SSH_KEY != '' }}
        uses: appleboy/scp-action@v0.1.7
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        with:
          host: ${{ secrets.CPANEL_HOST || '198.38.92.6' }}
          username: ${{ secrets.CPANEL_USER || 'natchevy' }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          source: "api"
          target: "/home/natchevy/apps/api"

      - name: Restart API on cPanel
        if: ${{ env.CPANEL_PASSWORD != '' || env.CPANEL_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        with:
          host: ${{ secrets.CPANEL_HOST || '198.38.92.6' }}
          username: ${{ secrets.CPANEL_USER || 'natchevy' }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          script: |
            cd /home/natchevy/apps/api || exit 1
            chmod +x api
            pkill -x api || true

            if [ ! -f ./start.sh ]; then
              cat << 'EOF' > ./start.sh
            #!/bin/bash
            APP_DIR="/home/natchevy/apps/api"
            cd "$APP_DIR" || exit 1
            if ! pgrep -x api > /dev/null; then
                nohup ./api >> api.log 2>&1 &
            fi
            EOF
              chmod +x ./start.sh
            fi

            ./start.sh
            echo "Deployment to cPanel complete!"

  sync-to-sanity:
    name: Sync Release to Sanity CMS
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upsert Release in Sanity CMS
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
          TARGET_COMMITISH: ${{ github.sha }}
          ALLOW_EMPTY_SECRETS: "true"
        run: |
          node .github/scripts/sync-release-sanity.js
